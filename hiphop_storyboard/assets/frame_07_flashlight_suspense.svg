<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="55%" stop-color="#0f141d"/>
      <stop offset="100%" stop-color="#171f2c"/>
    </linearGradient>
    <radialGradient id="flare7" cx="72%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="1"/>
      <stop offset="18%" stop-color="#f5b942" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#e59b27" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam7" x1="72%" y1="42%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#e59b27" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e59b27" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Night Depot Background -->
  <rect width="1600" height="900" fill="url(#bg7)"/>

  <!-- Distant Subway Car & Tracks on Right (Deep Focus Plane B) -->
  <g opacity="0.65">
    <rect x="820" y="160" width="740" height="320" rx="14" fill="#18202c" stroke="#36465e" stroke-width="3"/>
    <rect x="860" y="205" width="140" height="95" rx="8" fill="#0d1219" stroke="#495d7a" stroke-width="2"/>
    <rect x="1040" y="205" width="140" height="95" rx="8" fill="#0d1219" stroke="#495d7a" stroke-width="2"/>
    <rect x="1220" y="205" width="140" height="95" rx="8" fill="#0d1219" stroke="#495d7a" stroke-width="2"/>
    <line x1="760" y1="680" x2="1600" y2="540" stroke="#495d7a" stroke-width="6"/>
    <line x1="760" y1="760" x2="1600" y2="590" stroke="#36465e" stroke-width="8"/>
  </g>

  <!-- Security Guard Silhouette & Volumetric Flashlight Cone -->
  <polygon points="1150,378 180,900 980,900" fill="url(#beam7)"/>
  <circle cx="1150" cy="378" r="320" fill="url(#flare7)"/>
  <!-- Guard figure -->
  <g fill="#090c12" stroke="#e59b27" stroke-width="1.5">
    <circle cx="1185" cy="305" r="22"/>
    <path d="M1152,292 L1218,292 L1208,275 L1162,275 Z" fill="#141a24"/>
    <rect x="1152" y="330" width="66" height="115" rx="10"/>
    <rect x="1158" y="445" width="24" height="120"/>
    <rect x="1188" y="445" width="24" height="120"/>
    <line x1="1155" y1="365" x2="1125" y2="380" stroke="#090c12" stroke-width="14" stroke-linecap="round"/>
  </g>
  <circle cx="1135" cy="378" r="18" fill="#ffffff" filter="url(#glow7)"/>

  <!-- Foreground Subway Undercarriage & Bogie Wheel (Plane A) -->
  <rect x="0" y="0" width="840" height="230" fill="#0b0e14" stroke="#283344" stroke-width="3"/>
  <g fill="#141923" stroke="#2e3b4e" stroke-width="2">
    <rect x="40" y="30" width="75" height="165"/>
    <rect x="150" y="30" width="75" height="165"/>
    <rect x="260" y="30" width="75" height="165"/>
    <rect x="370" y="30" width="75" height="165"/>
    <rect x="480" y="30" width="75" height="165"/>
    <rect x="590" y="30" width="75" height="165"/>
  </g>
  <!-- Steel Wheel & Brake Beam -->
  <circle cx="195" cy="610" r="175" fill="#0d1017" stroke="#46566e" stroke-width="12"/>
  <circle cx="195" cy="610" r="110" fill="#151b26" stroke="#637896" stroke-width="5"/>
  <circle cx="195" cy="610" r="38" fill="#090c10" stroke="#859bb8" stroke-width="4"/>
  <rect x="0" y="410" width="790" height="82" fill="#151b24" stroke="#4a5a70" stroke-width="4"/>

  <!-- Fresh Dripping Graffiti Tag on Undercarriage Beam -->
  <g filter="url(#glow7)">
    <path d="M410,462 L445,425 L475,468 L515,422 L550,465 L595,425 L635,460" fill="none" stroke="#00c2e0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M425,472 L620,468" fill="none" stroke="#e0246a" stroke-width="6" stroke-linecap="round"/>
    <line x1="448" y1="468" x2="448" y2="512" stroke="#00c2e0" stroke-width="5" stroke-linecap="round"/>
    <line x1="518" y1="468" x2="518" y2="528" stroke="#00c2e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="582" y1="468" x2="582" y2="504" stroke="#e0246a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Foreground Heroes Crouching in Shadow: Kilo-Watt & Nova -->
  <!-- Kilo-Watt silhouette with mustard rim highlight -->
  <g>
    <path d="M180,900 L225,555 C245,510 390,510 420,565 L465,900 Z" fill="#171410" stroke="#d99b26" stroke-width="5"/>
    <circle cx="325" cy="468" r="56" fill="#12100e" stroke="#d99b26" stroke-width="4"/>
    <ellipse cx="315" cy="465" rx="16" ry="9" fill="none" stroke="#f5c451" stroke-width="2.5"/>
    <ellipse cx="355" cy="465" rx="16" ry="9" fill="none" stroke="#f5c451" stroke-width="2.5"/>
  </g>

  <!-- Nova silhouette in foreground holding dripping squeezer marker -->
  <g>
    <path d="M435,900 L478,575 C505,535 645,540 680,590 L725,900 Z" fill="#141822" stroke="#00c2e0" stroke-width="5"/>
    <!-- Cyan double buns -->
    <circle cx="520" cy="435" r="26" fill="#0c1824" stroke="#00c2e0" stroke-width="4"/>
    <circle cx="622" cy="438" r="26" fill="#0c1824" stroke="#00c2e0" stroke-width="4"/>
    <circle cx="572" cy="488" r="54" fill="#16141c" stroke="#e0246a" stroke-width="4"/>
    <!-- 3M Respirator around neck -->
    <ellipse cx="545" cy="552" rx="22" ry="16" fill="#232733" stroke="#e0246a" stroke-width="3"/>
    <ellipse cx="602" cy="552" rx="22" ry="16" fill="#232733" stroke="#e0246a" stroke-width="3"/>
    <!-- Hand with Squeezer Marker -->
    <rect x="625" y="445" width="22" height="68" rx="6" transform="rotate(-24 625 445)" fill="#e0246a" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Split-Diopter Optical Line & Camera Viewfinder HUD -->
  <line x1="835" y1="0" x2="735" y2="900" stroke="#e59b27" stroke-width="2.5" stroke-dasharray="12,8" opacity="0.75"/>
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#e59b27" stroke-width="2" opacity="0.5"/>
  <g transform="translate(50, 50)">
    <rect width="650" height="86" rx="6" fill="#090b10" opacity="0.88" stroke="#e59b27" stroke-width="1.5"/>
    <text x="22" y="34" fill="#e59b27" font-family="monospace" font-weight="bold" font-size="22">КАДР 07 // САСПЕНС: ЛУЧ ФОНАРЯ ОХРАНЫ (02:30–02:50)</text>
    <text x="22" y="64" fill="#00c2e0" font-family="monospace" font-size="16">ОПТИКА: 35mm ANAMORPHIC + SPLIT-DIOPTER | ЗВУК: LOW-PASS 250Hz</text>
  </g>
  <g transform="translate(50, 790)">
    <rect width="420" height="44" rx="4" fill="#090b10" opacity="0.82" stroke="#46566e" stroke-width="1"/>
    <text x="16" y="28" fill="#cbd5e1" font-family="monospace" font-size="15">ФОКУС А: NOVA (0.4м)  ||  ФОКУС Б: ОХРАННИК (25м)</text>
  </g>
</svg>